# GitHub Pages への公開．このファイルは web/ の内容をルートに置いた公開リポジトリ用である．
# 親リポジトリの KanjiBlocks/web/ 配下にあるあいだは GitHub に認識されず，何も起きない．
# RANKING_API と PUBLIC_URL はリポジトリの変数（Settings → Secrets and variables → Actions → Variables）で，
# いずれも公開値としてビルド成果物に埋め込まれる．PUBLIC_URL が無いときは Pages の URL を使う．
# CF_BEACON_TOKEN（Cloudflare Web Analytics）と GOOGLE_SITE_VERIFICATION（Search Console）は任意である．
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_RANKING_API: ${{ vars.RANKING_API }}
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || format('{0}/', steps.pages.outputs.base_url) }}
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
